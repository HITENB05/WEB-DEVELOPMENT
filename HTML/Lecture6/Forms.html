<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1>
        FORMS
    </h1>
    <div>

        <form action="WelcomePage.html" target="_blank">
            <fieldset>
                <legend>Enter Your basic details:-</legend>
                <label for="FullName">Full Name :</label>
                <input type="text" id="FullName" placeholder="Enter your name" required>

                <br><br>
                <label for="email"> Email :</label>
                <input type="email" id="email" placeholder="Enter your email" required>

                <br><br>
                <label for="password">Password : </label>
                <input type="password" id="password" placeholder="Enter your password" required>

                <br><br>
                <label for="checkbox">Are you 18 + ? </label>
                <input type="checkbox" id="checkbox" required>


                <br><br>
                <label for="phonenumber">Enter your phone number : </label>
                <input type="id" id="phonenumber" required min="0">

                <br><br>
                <label for="gender">Gender :</label>
                <label for="">Male :</label>
                <input type="radio" id="gender" name="gender">
                <label for="">Female :</label>
                <input type="radio" id="gender" name="gender">

                <br><br>
                <label for="date"> Enter your DOB : </label>
                <input type=" date" id="date" required>

                <br><br>
                <label for="file">Upload Photo </label>
                <input type="file" id="file">

                <br><br>
                <label for="city">Select your current city : </label>
                <select type="city" id="city" required>
                    <option value="">Delhi</option>
                    <option value="">Kkr</option>
                    <option value="">Mumbai</option>
                    <option value="">Noida</option>
                    <option value="">ambala</option>
                    <option value="">karnal</option>
                    <option value="">faridabad</option>
                </select>
                <br><br>
                <input type="submit">
                <button type="submit" Submit your form>Submit Your Form</button>


            </fieldset>
        </form>
    </div>
</body>

</html>
